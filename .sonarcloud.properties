# SonarCloud automatic analysis settings.
#
# The tr/en message trees mirror each other key-for-key by design (the i18n
# parity test enforces it), so copy-paste detection reads every new key as
# duplicated twice. Only these files are excluded from CPD — all other rules
# and every other file keep the default quality gate.
#
# frontend/src/lib/api/generated/** is written by `npm run gen:api` from the
# backend's OpenAPI schema; routes with the same shape (approve / reject /
# withdraw) generate the same blocks. Nothing there is edited by hand, and
# tests fail if it is, so its duplication is not something to fix.
sonar.cpd.exclusions=frontend/src/lib/i18n/messages/**,frontend/src/lib/api/generated/**
