# SonarCloud automatic analysis settings.
#
# The tr/en message trees mirror each other key-for-key by design (the i18n
# parity test enforces it), so copy-paste detection reads every new key as
# duplicated twice. Only these files are excluded from CPD — all other rules
# and every other file keep the default quality gate.
sonar.cpd.exclusions=frontend/src/lib/i18n/messages/**
