apiVersion: v1
kind: ConfigMap
metadata:
  name: aicfo-config
  namespace: aicfo
data:
  LLM_MODEL: "deepseek-chat"
  LLM_BASE_URL: "https://api.deepseek.com"
  LLM_TEMPERATURE: "0"
  LLM_MAX_TOKENS: "16384"
  USE_SQLITE: "false"
  # Required with Postgres (preflight); production = fatal on unsafe settings, incl. mail-dependent features with no SMTP.
  APP_ENV: "production"
  BACKEND_PORT: "8000"
  BACKEND_CORS_ORIGINS: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"
  NEXTAUTH_URL: "http://localhost:3000"
  STORAGE_BACKEND: "local"
  MAX_UPLOAD_SIZE_MB: "10"
  AUTO_ENQUEUE_ANALYSIS_ON_UPLOAD: "true"
  RAG_BACKFILL_ENABLED: "true"
  RAG_EMBEDDING_ENABLED: "true"
  # Retention in dry run until the first report is reviewed (docs/ops/first-deploy-checklist.md section 7).
  RETENTION_DRY_RUN: "true"
  ARQ_ANALYSIS_QUEUE_NAME: "arq:queue:analysis"
  ARQ_MAINTENANCE_QUEUE_NAME: "arq:queue:maintenance"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aicfo"
  POSTGRES_USER: "aicfo"
  REDIS_URL: "redis://redis:6379/0"
  FRONTEND_URL: "http://localhost:3000"
  # REQUIRED in production (the preflight refuses to start without them): public links of the published texts.
  PRIVACY_NOTICE_URL: ""
  TERMS_URL: ""
  # Behind the ingress controller: one proxy hop. Without this every client shares one rate-limit bucket.
  TRUSTED_PROXY_COUNT: "1"
