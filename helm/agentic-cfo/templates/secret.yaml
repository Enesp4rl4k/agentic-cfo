apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-cfo.fullname" . }}-secrets
  labels:
    {{- include "agentic-cfo.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  BACKEND_SECRET_KEY: {{ .Values.secrets.backendSecretKey | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | quote }}
