apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-cfo.fullname" . }}-config
  labels:
    {{- include "agentic-cfo.labels" . | nindent 4 }}
data:
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_BASE_URL: {{ .Values.config.llmBaseUrl | quote }}
  LLM_TEMPERATURE: {{ .Values.config.llmTemperature | quote }}
  LLM_MAX_TOKENS: {{ .Values.config.llmMaxTokens | quote }}
  USE_SQLITE: "false"
  APP_ENV: "production"
  BACKEND_PORT: "8000"
  BACKEND_CORS_ORIGINS: "http://localhost:3000,https://{{ (index .Values.ingress.hosts 0).host }}"
  NEXT_PUBLIC_API_URL: "https://{{ (index .Values.ingress.hosts 0).host }}/api"
  NEXTAUTH_URL: "https://{{ (index .Values.ingress.hosts 0).host }}"
  # E-mailed links (verification, reset, invite) and the app's public address: the preflight refuses localhost.
  FRONTEND_URL: "https://{{ (index .Values.ingress.hosts 0).host }}"
  BRAND_APP_URL: "https://{{ (index .Values.ingress.hosts 0).host }}"
  # REQUIRED: the public https links of the published texts people are asked to accept (preflight: FATAL otherwise).
  PRIVACY_NOTICE_URL: {{ required "config.privacyNoticeUrl is required (public https link of the privacy notice)" .Values.config.privacyNoticeUrl | quote }}
  TERMS_URL: {{ required "config.termsUrl is required (public https link of the terms of use)" .Values.config.termsUrl | quote }}
  STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  MAX_UPLOAD_SIZE_MB: {{ .Values.config.maxUploadSizeMb | quote }}
  AUTO_ENQUEUE_ANALYSIS_ON_UPLOAD: {{ .Values.config.autoEnqueueAnalysis | quote }}
  RAG_BACKFILL_ENABLED: {{ .Values.config.ragBackfillEnabled | quote }}
  RAG_EMBEDDING_ENABLED: {{ .Values.config.ragEmbeddingEnabled | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_HOST: {{ include "agentic-cfo.fullname" . }}-postgres
  POSTGRES_PORT: "5432"
  {{- else }}
  POSTGRES_HOST: {{ required "postgres.external.host is required when postgres.enabled is false" .Values.postgres.external.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.external.port | quote }}
  POSTGRES_SSLMODE: {{ .Values.postgres.external.sslmode | quote }}
  {{- end }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  REDIS_URL: "redis://{{ include "agentic-cfo.fullname" . }}-redis:6379/0"
