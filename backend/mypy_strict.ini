# mypy_strict.ini — the type-clean allowlist (CI GATES on this, exit non-zero on any error).
#
# This is the "greened, module-by-module" set from the mypy paydown (Faz 10).
# Full-tree `mypy app/` still runs in verify but only as a NON-BLOCKING warning
# (527 legacy errors). This file is the ratchet: modules listed here must stay
# at zero errors. Add a module (or a fully-green subpackage) only after it is
# clean; never remove one to silence a regression — fix the regression.
#
# What stands between this list and the rest of the tree, measured 2026-09-08:
#
#   1. LangGraph. `StateGraph.add_node` and `.compile()` are under-typed
#      upstream, so every orchestrator reports the same handful of arg-type and
#      attr-defined errors on code that is correct. This is most of what is
#      left in app/agents/*/orchestrator.py — greening it means ignores, and an
#      ignore added to satisfy a ratchet is how a ratchet stops catching
#      things, so it is a decision to take deliberately rather than in passing.
#   2. Legacy `Column[str]` model annotations. Assigning a plain str to one is
#      fine at runtime and an error to mypy; the fix is migrating those models
#      to `Mapped[...]`, which is a change worth making on its own.
#
# Neither is a bug. The errors that were bugs — a connector reading fields that
# do not exist on ParsedTransaction — came out while adding packages here, and
# that is the argument for continuing.

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
no_error_summary = False
pretty = True
files =
    app/agents/verifier_node.py,
    app/agents/reconciliation_node.py,
    app/agents/tr_vertical.py,
    app/agents/checkpointer.py,
    app/agents/run_ledger.py,
    app/agents/confidence_breakdown.py,
    app/services/eval_harness.py,
    app/mcp/server.py,
    app/services/edefter_berat.py,
    app/services/edefter_package.py,
    app/services/gib_edefter_ws.py,
    app/services/llm_structured.py,
    app/services/eng_signals.py,
    app/services/smmm_defensibility.py,
    app/services/institutionalization.py,
    app/services/related_party.py,
    app/scheduler.py,
    app/connectors/,
    app/models/,
    app/parsers/,
    app/streaming/,
    app/core/,
    app/middleware/,
    app/platform/,
    app/agents/accounting/,
    app/services/connectors/,
    app/services/data_plane/,
    app/services/negotiation/,
    app/services/open_banking/,
    app/services/rag/,
    app/services/regional/,
    app/services/semantic/
