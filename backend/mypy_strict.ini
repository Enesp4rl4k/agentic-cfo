# mypy_strict.ini — the type-clean allowlist (CI GATES on this, exit non-zero on any error).
#
# This is the "greened, module-by-module" set from the mypy paydown (Faz 10).
# Full-tree `mypy app/` still runs in verify but only as a NON-BLOCKING warning
# (~580 legacy errors). This file is the ratchet: modules listed here must stay
# at zero errors. Add a module (or a fully-green subpackage) only after it is
# clean; never remove one to silence a regression — fix the regression.

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
no_error_summary = False
pretty = True
files =
    app/platform/model_gateway.py,
    app/platform/model_catalog.py,
    app/platform/policies.py,
    app/platform/contracts.py,
    app/platform/authority_matrix.py,
    app/agents/verifier_node.py,
    app/agents/reconciliation_node.py,
    app/agents/tr_vertical.py,
    app/agents/checkpointer.py,
    app/agents/run_ledger.py,
    app/agents/confidence_breakdown.py,
    app/services/eval_harness.py,
    app/services/llm_structured.py,
    app/services/eng_signals.py,
    app/services/smmm_defensibility.py,
    app/services/institutionalization.py,
    app/services/related_party.py,
    app/scheduler.py,
    app/connectors/,
    app/models/,
    app/parsers/,
    app/streaming/
