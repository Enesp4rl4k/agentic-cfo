name: Ops — backup and restore roundtrip

# A backup nobody has restored is a hope. This job restores a real pg_dump into a fresh Postgres,
# checks every table and file came back, runs the application's own schema preflight against it (and
# against it one migration behind), then runs scripts/smoke-test.sh on an API started over the restored
# database. scripts/restore-roundtrip.sh has the steps and says what each proves.
#
# A separate workflow so a slow or red run here never delays the required checks in ci.yml. Nothing
# needs a secret: the database container trusts the runner, the signing keys are generated per run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [main, master, develop]
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - "backend/app/core/preflight.py"
      - "backend/app/api/ops.py"
      - "backend/requirements.txt"
      - "scripts/restore-roundtrip.sh"
      - "scripts/smoke-test.sh"
      - ".github/workflows/ops-restore.yml"
  schedule:
    - cron: "17 4 * * 1"   # weekly: the procedure rots when nobody runs it
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  restore-roundtrip:
    name: Restore roundtrip (dump, restore, migrate, health)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16   # the schema has a pgvector column (migration 023)
        env:
          POSTGRES_USER: aicfo
          # A container on this runner, reachable only from it and gone when the job ends.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aicfo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --only-binary :all: -r requirements.txt

      - name: Dump, restore, migrate, preflight, smoke test
        env:
          PGHOST: localhost
          PGUSER: aicfo
        run: bash scripts/restore-roundtrip.sh
