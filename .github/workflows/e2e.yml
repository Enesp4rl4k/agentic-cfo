name: E2E — Pilot flow (browser)

# One user journey in a real browser against the real stack: register, upload, cash radar,
# Monday briefing, a correction, a plan change, an accountant's release, a viewer's refusal,
# the decision record. Playwright, Chromium only, one worker. See frontend/e2e/README.md.
#
# A separate workflow, so a red or slow run here never delays the required checks in ci.yml.
# Nothing needs a secret: SQLite for the API (its tables are built on startup), no Redis (an
# upload's analysis runs inline, the product's own fallback), no LLM key (a stub answers the one
# call the journey makes), no SMTP (the outbox is read, not delivered).

on:
  push:
    branches: [master]
  pull_request:
    branches: [main, master, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pilot-flow:
    name: Pilot flow (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Baked into the frontend at build time; the API listens here.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Type-check the journey
        working-directory: frontend
        run: npx tsc -p e2e/tsconfig.json

      - name: Build the frontend
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: e2e-nextauth-throwaway-secret-0123456789abcdef
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the pilot flow
        working-directory: frontend
        env:
          CI: "true"
        run: npm run e2e

      - name: Upload trace, video and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pilot-flow
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-flow-api-log
          path: frontend/e2e/.run/api.log
          if-no-files-found: ignore
          retention-days: 14
