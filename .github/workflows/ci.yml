name: CI/CD — Agentic CFO

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Avoid concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"
  REGISTRY:       ghcr.io
  IMAGE_NAME:     ${{ github.repository }}

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:
  # ── Consolidation proof gate (canonical CI entrypoint) ────────────────────
  proof-gate:
    name: Proof Gate (verify.sh + structural)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     aicfo
          POSTGRES_PASSWORD: aicfo
          POSTGRES_DB:       aicfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Run consolidation proof gate
        env:
          DATABASE_URL:       postgresql+asyncpg://aicfo:aicfo@localhost:5432/aicfo_test
          REDIS_URL:          redis://localhost:6379/0
          BACKEND_SECRET_KEY: ci-test-secret-key-32chars!!!!!
          OPENAI_API_KEY:     llm-placeholder-ci
          LOG_FORMAT:         plain
        run: |
          chmod +x verify.sh scripts/*.sh
          ./scripts/proof.sh --fast

  # ── Backend: lint + test (legacy — kept for coverage upload) ──────────────
  backend-ci:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [proof-gate]
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     aicfo
          POSTGRES_PASSWORD: aicfo
          POSTGRES_DB:       aicfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio pytest-cov

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ --output-format=github

      - name: Mypy type check
        working-directory: backend
        run: |
          mypy app/ \
            --ignore-missing-imports \
            --no-error-summary \
            --exclude '(migrations|alembic)' \
            2>&1 | tail -20 || true  # Non-blocking for now

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL:         postgresql+asyncpg://aicfo:aicfo@localhost:5432/aicfo_test
          REDIS_URL:            redis://localhost:6379/0
          BACKEND_SECRET_KEY:   ci-test-secret-key-32chars!!!!!
          OPENAI_API_KEY:       llm-placeholder-ci
          LOG_FORMAT:           plain
        run: |
          pytest tests/ \
            -q \
            --tb=short \
            --no-header \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -x \
            --ignore=tests/test_parsers \
            2>&1 | tail -30

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend: typecheck + build ───────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    needs: [proof-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit 2>&1 | tail -30 || true  # Non-blocking (workspace tsconfig)

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXTAUTH_SECRET:     ci-test-secret
          NEXTAUTH_URL:        http://localhost:3000
        run: npm run build

  # ── Docker build (push to GHCR on main only) ──────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [proof-gate, backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    true
          tags:    ${{ steps.meta-backend.outputs.tags }}
          labels:  ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    true
          tags:    ${{ steps.meta-frontend.outputs.tags }}
          labels:  ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:   fs
          scan-ref:    ./backend
          format:      table
          exit-code:   0    # Non-blocking
          severity:    CRITICAL,HIGH

      - name: Check for .env files accidentally committed
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$'; then
            echo "❌ .env file found in git — please add to .gitignore"
            exit 1
          fi
          echo "✓ No .env files committed"
