name: CI/CD — Agentic CFO

on:
  # `master` is this repository's default branch. The list used to name only
  # `main` and `develop`, so a push to the branch that actually ships ran none
  # of the gates below.
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Avoid concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "20"
  REGISTRY:       ghcr.io
  IMAGE_NAME:     ${{ github.repository }}

# Why every run of this file failed in 0 seconds, with no jobs, since at least
# 2026-08-20: GitHub rejects a workflow that uses a context where it is not
# available, and this one read the workflow `env` context in a job name and in
# job- and service-level env, where only github/needs/strategy/matrix/vars/
# secrets/inputs exist. backend/tests/test_ci_database.py now checks those
# positions.
#
# Nothing here needs a repository secret. The database password and signing
# keys are throwaway values for a container and a test run that exist only on
# the runner for the length of the job; requiring them as secrets meant CI
# stopped at its first step in any repository where nobody had added them.

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:
  # ── Consolidation proof gate (canonical CI entrypoint) ────────────────────
  proof-gate:
    name: Proof Gate (verify.sh + structural)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16   # the app stores embeddings in a pgvector column (migration 023)
        env:
          POSTGRES_USER:     aicfo
          # No password at all: a container on this runner, reachable only from
          # it and gone when the job ends. A literal one was flagged as a leaked
          # credential by every scanner that read the file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB:       aicfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate throwaway signing keys for this run
        run: |
          for name in BACKEND_SECRET_KEY NEXTAUTH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -c constraints.txt "ruff==0.16.4" mypy pytest-asyncio

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      # The staging stack (docker-compose.prod.yml + backup/restore scripts)
      # is otherwise only exercised on the VPS. shellcheck and docker are both
      # preinstalled on ubuntu-latest.
      - name: Staging stack — shellcheck + compose config
        run: bash scripts/check-prod-compose.sh

      - name: Run consolidation proof gate
        env:
          # The suite runs on SQLite (per-test in-memory databases). This job
          # used to set DATABASE_URL, which Settings does not read, so it looked
          # like a Postgres run and was not one. Migrations get their Postgres
          # run in `migrations-postgres` below.
          USE_SQLITE:         "true"
          REDIS_URL:          redis://localhost:6379/0
          OPENAI_API_KEY:     llm-placeholder-ci
          LOG_FORMAT:         plain
          LANGGRAPH_CHECKPOINT: memory
        run: |
          chmod +x verify.sh scripts/*.sh
          ./scripts/proof.sh --fast

  # ── Migrations against a real Postgres ────────────────────────────────────
  # The chain cannot run on SQLite (migration 005 alters constraints), and no
  # job ran it anywhere, so a broken migration surfaced only in production.
  # Four separate steps so a red run says which property failed: the chain
  # applies from empty, the result matches the models, every downgrade runs,
  # and the chain applies again after it.
  migrations-postgres:
    name: Migrations on Postgres (upgrade, drift, downgrade)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16   # the app stores embeddings in a pgvector column (migration 023)
        env:
          POSTGRES_USER:     aicfo
          # No password at all: a container on this runner, reachable only from
          # it and gone when the job ends. A literal one was flagged as a leaked
          # credential by every scanner that read the file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB:       aicfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Only the restore roundtrip below needs it: /api/v1/ready requires Redis in production.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      USE_SQLITE:            "false"
      APP_ENV:               ci
      DATABASE_URL_OVERRIDE: postgresql+asyncpg://aicfo@localhost:5432/aicfo_test
      BACKEND_SECRET_KEY:    ci-migrations-only-not-a-secret
      OPENAI_API_KEY:        llm-placeholder-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Apply every migration from an empty database
        working-directory: backend
        run: alembic upgrade head

      - name: Models and migrations describe the same schema
        working-directory: backend
        # A ratchet over `alembic check`: new drift and anything the models
        # need that the migrations lack fail; known legacy differences are
        # listed in alembic/known_drift.txt and may only shrink.
        run: python ../scripts/schema_drift.py

      - name: Agent-memory erasure runs on Postgres (two tenants, only one erased)
        working-directory: backend
        run: python -m pytest tests/test_erasure_postgres.py -q -p no:randomly

      # The langgraph checkpoint tables are created by the library when the saver first connects (not by Alembic).
      # A skipped safety test is a defect: the summary line is checked, as for the atomicity test below.
      - name: LangGraph checkpoints on Postgres (tenant isolation, CEO path and legacy rows erased, no-org runs unsaved, retention)
        working-directory: backend
        run: |
          # `|| rc=$?`: under `bash -e` a failing pytest inside $(...) ended the step before its output was printed.
          rc=0
          out="$(python -m pytest tests/test_checkpointer_postgres.py -q -p no:randomly -rs 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the Postgres checkpointer test failed (exit $rc)"
            exit "$rc"
          fi
          if echo "$out" | grep -Eqi "skipped|no tests ran" || ! echo "$out" | grep -Eq "[0-9]+ passed"; then
            echo "::error::the Postgres checkpointer test did not run (skipped or not collected)"
            exit 1
          fi

      - name: Schema drift still clean with the library-managed checkpoint tables present
        working-directory: backend
        run: python ../scripts/schema_drift.py

      - name: Every migration can be rolled back
        working-directory: backend
        run: alembic downgrade base

      - name: The chain applies again after a full rollback
        working-directory: backend
        run: alembic upgrade head

      # SQLite releases a SAVEPOINT differently from Postgres: the hourly KRI scan's slot/retry guarantee
      # (one org failing fails the slot, the retry completes it without repeating the others) is checked here too.
      - name: Scheduled-job atomicity on Postgres
        working-directory: backend
        # A skipped safety test is a defect, not a pass: pytest exits 0 when every test is skipped (the test skips
        # itself when DATABASE_URL_OVERRIDE is not a Postgres URL), so the summary line is checked here.
        run: |
          out="$(python -m pytest tests/test_scan_atomicity_postgres.py -q -p no:randomly -rs)"
          echo "$out"
          if echo "$out" | grep -Eqi "skipped|no tests ran" || ! echo "$out" | grep -Eq "[0-9]+ passed"; then
            echo "::error::the Postgres atomicity test did not run (skipped or not collected)"
            exit 1
          fi

      # A backup nobody has restored is a hope. Dump a migrated database, restore it into a fresh one,
      # check every table and file came back, run the schema preflight on it (and one migration behind),
      # then the smoke test on an API over the restored database. scripts/restore-roundtrip.sh.
      - name: Backup and restore roundtrip (dump, restore, migrate, preflight, smoke test)
        env:
          PGUSER: aicfo
        # The dump and restore run with the server container's own pg_dump/pg_restore (version 16).
        run: |
          RT_PG_CONTAINER="$(docker ps -q --filter "ancestor=pgvector/pgvector:pg16" | head -n1)"
          export RT_PG_CONTAINER
          bash scripts/restore-roundtrip.sh

  # ── Optional load baseline (INTENTIONALLY NON-BLOCKING artifact) ──────────
  # continue-on-error: a P95 over 30 requests on a shared runner is noisy; the job
  # records a number for ops and must never gate a merge. It is not a test.
  load-baseline:
    name: Load Baseline (NON-BLOCKING, ops P95 artifact)
    runs-on: ubuntu-latest
    needs: [proof-gate]
    continue-on-error: true
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    services:
      postgres:
        image: pgvector/pgvector:pg16   # the app stores embeddings in a pgvector column (migration 023)
        env:
          POSTGRES_USER:     aicfo
          # No password at all: a container on this runner, reachable only from
          # it and gone when the job ends. A literal one was flagged as a leaked
          # credential by every scanner that read the file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB:       aicfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate throwaway signing keys for this run
        run: |
          for name in BACKEND_SECRET_KEY NEXTAUTH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Start API briefly for baseline
        working-directory: backend
        env:
          # DATABASE_URL_OVERRIDE is the name Settings reads; DATABASE_URL was
          # ignored, so with USE_SQLITE=false this connected to the postgres_*
          # defaults rather than the service container.
          DATABASE_URL_OVERRIDE: postgresql+asyncpg://aicfo@localhost:5432/aicfo_test
          REDIS_URL:          redis://localhost:6379/0
          OPENAI_API_KEY:     llm-placeholder-ci
          USE_SQLITE:         "false"
          APP_ENV:            ci
          REGISTRATION_MODE:  open
          LANGGRAPH_CHECKPOINT: memory
        # The server's output went to the step's own pipe, so the step never
        # finished: it ran until the job's 6-hour limit and was cancelled.
        # Detached, logged to a file, and a failure if it never answers.
        # The database was empty — nothing applied the migrations before the
        # API started against it — and curl had no timeout, so a server that
        # accepted the connection and never answered held the step forever.
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:8000/api/v1/system/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not answer in 60s"
          tail -50 ../api.log
          exit 1

      - name: Run load baseline
        env:
          BACKEND_URL: http://127.0.0.1:8000
          LOAD_REQUESTS: "30"
          LOAD_CONCURRENCY: "5"
          LOAD_P95_MS: "2000"
        run: |
          chmod +x scripts/load-baseline.sh
          mkdir -p artifacts
          ./scripts/load-baseline.sh | tee artifacts/load-baseline.txt

      - name: Upload load baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-baseline
          path: artifacts/load-baseline.txt
          if-no-files-found: warn

  # ── Backend: lint + test (legacy — kept for coverage upload) ──────────────
  backend-ci:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [proof-gate]
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16   # the app stores embeddings in a pgvector column (migration 023)
        env:
          POSTGRES_USER:     aicfo
          # No password at all: a container on this runner, reachable only from
          # it and gone when the job ends. A literal one was flagged as a leaked
          # credential by every scanner that read the file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB:       aicfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate throwaway signing keys for this run
        run: |
          for name in BACKEND_SECRET_KEY NEXTAUTH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -c constraints.txt "ruff==0.16.4" mypy pytest-asyncio pytest-cov

      # tests/test_pdf_ocr_end_to_end.py runs the scanned-PDF path (PyMuPDF render, Pillow, Tesseract)
      # only where the binary and the Turkish and English models exist; the production image has them.
      - name: Install Tesseract (OCR path test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng

      # The PDF parsing guards and the OCR path, run on their own and not through the pipe of "Run tests", so a
      # failure here is a red step. REQUIRE_TESSERACT makes the OCR test fail instead of skip when the
      # binary or the Turkish/English models are missing.
      - name: PDF isolation, report escaping and OCR path tests
        working-directory: backend
        env:
          REQUIRE_TESSERACT: "1"
        run: >
          python -m pytest -q -rs
          tests/test_pdf_ocr_end_to_end.py tests/test_pdf_upload_guard.py tests/test_parser_isolation_fitness.py
          tests/test_report_hostile_text.py tests/test_report_render_no_fetch.py
          tests/test_sheet_isolation.py tests/test_pdf_isolation_followups.py
          tests/test_parser_memory_measure.py tests/test_parser_memory_deploy_matrix.py tests/test_xlsx_statement_fixtures.py tests/test_parser_guard.py tests/test_page_gap.py tests/test_pages_not_read_reach_the_user.py

      # requirements.txt is exact pins, constraints.txt pins the rest, and what
      # pip just installed is exactly that set. A new transitive package or a
      # version that moved fails here, not silently in the next run.
      # docs/ops/dependency-pinning.md
      - name: Dependency pins match the installed environment
        working-directory: backend
        env:
          CHECK_INSTALLED_PINS: "1"
        run: python -m pytest tests/test_dependency_pins.py -q -p no:randomly

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ --output-format=github

      - name: Mypy strict allowlist (blocking)
        working-directory: backend
        run: mypy --config-file mypy_strict.ini

      # INTENTIONALLY NON-BLOCKING: `|| true` below means this step cannot fail. The
      # blocking type gate is the strict allowlist above.
      - name: Mypy full tree (ADVISORY, NON-BLOCKING - cannot fail)
        working-directory: backend
        run: |
          mypy app/ \
            --ignore-missing-imports \
            --no-error-summary \
            --exclude '(migrations|alembic)' \
            2>&1 | tail -20 || true  # ~590 legacy errors; greened module-by-module into mypy_strict.ini

      # GİB's own published packages: 43 e-Fatura samples covering every invoice
      # type code it issues, and the e-Defter XBRL GL schemas a ledger is
      # validated against. Not vendored — a copy in the tree drifts from the
      # standard, and drift is what these tests exist to catch. The corpus tests
      # skip without it, so a failure here must not be silent.
      - name: Fetch GİB corpus
        run: python scripts/fetch_gib_corpus.py

      # No pipe: `| tail` made this step exit 0 whatever pytest returned (the shell
      # is `bash -e` without pipefail), so failing tests here were green for weeks.
      # `-rfE` ends the log with one FAILED/ERROR line per test, so the cause is
      # readable without scrolling a 30-minute log.
      # -v and the header (it prints pytest-randomly's seed) because one run of this step hung
      # for the job's whole hour while the same code finished in 21 minutes on the run before:
      # the last test name and the seed are what a hang needs. faulthandler_timeout dumps every
      # thread's stack if one test runs past 15 minutes; timeout-minutes turns a hang into a
      # failure that names the step instead of a silent hour.
      - name: Run tests
        timeout-minutes: 50
        working-directory: backend
        env:
          # SQLite, said plainly — see proof-gate. DATABASE_URL is not a
          # setting and was silently ignored.
          USE_SQLITE:           "true"
          REDIS_URL:            redis://localhost:6379/0
          OPENAI_API_KEY:       llm-placeholder-ci
          LOG_FORMAT:           plain
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -o faulthandler_timeout=900 \
            -rfE \
            --cov=app \
            --cov-report=term:skip-covered \
            --cov-report=xml

      - name: Golden-case eval gate
        working-directory: backend
        env:
          OPENAI_API_KEY:     llm-placeholder-ci
          USE_SQLITE:         "true"
        run: pytest -q --no-header -m eval

      - name: Connector Platform gate (Faz 13)
        working-directory: backend
        env:
          OPENAI_API_KEY:     llm-placeholder-ci
          USE_SQLITE:         "true"
        run: pytest -q --no-header -m connectors

      # INTENTIONALLY NON-BLOCKING: coverage is reported, not gated; an upload failure
      # (no token, Codecov outage) must not fail the build. `if: always()` only so a
      # failed test run still uploads its coverage; it does not change the job result.
      - name: Upload coverage (NON-BLOCKING)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend: typecheck + build ───────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    needs: [proof-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate throwaway signing keys for this run
        run: |
          for name in BACKEND_SECRET_KEY NEXTAUTH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXTAUTH_URL:        http://localhost:3000
        run: npm run build

  # ── Which images need building on this run ────────────────────────────────
  # ci.yml runs on every pull request, so path filtering cannot live in the `on:`
  # block (it would skip the required checks). This job decides for the image jobs:
  # always on a push to the default branch, and on a pull request only when it
  # touches the image's inputs (the Dockerfile, requirements*.txt/constraints.txt
  # and the code live under backend/ or frontend/) or this workflow.
  image-changes:
    name: Which images to build
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the base branch
        id: diff
        env:
          EVENT:    ${{ github.event_name }}
          REF:      ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            # The default branch (master; main is kept for a future rename) builds both.
            if [ "$REF" = "refs/heads/master" ] || [ "$REF" = "refs/heads/main" ]; then
              echo "backend=true"  >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false"  >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(backend/|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Docker image build: BUILD ONLY, nothing is pushed ─────────────────────
  # This job used to be gated on refs/heads/main while the default branch is
  # master, so it never ran and the production image was never built by CI.
  # It builds (push: false, load: true), then starts the image once with no
  # network and no database to prove it imports. There is no registry login and no
  # push step anywhere in this file; publishing an image needs a deliberate
  # decision (see the PR that introduced this job).
  docker-backend:
    name: Docker image build - backend (build only, no push)
    runs-on: ubuntu-latest
    needs: [image-changes]
    if: needs.image-changes.outputs.backend == 'true'
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image (not pushed)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    false
          load:    true
          tags:    agentic-cfo-backend:ci
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # No network, no database: the app, its PDF/OCR libraries and the migrations
      # must import and be where the entrypoint expects them.
      - name: Smoke test - the built image starts importing
        run: |
          docker run --rm --network none \
            -e USE_SQLITE=true -e APP_ENV=ci -e LOG_FORMAT=plain \
            -e BACKEND_SECRET_KEY="$(openssl rand -hex 32)" \
            agentic-cfo-backend:ci \
            sh -ec '
              python -c "import app.main, weasyprint, fitz, pytesseract, pdfplumber, lxml; print(\"imports ok\")"
              tesseract --list-langs | grep -qx tur
              test -f alembic.ini && test -d alembic
              python -m app.core.preflight
            '

  docker-frontend:
    name: Docker image build - frontend (build only, no push)
    runs-on: ubuntu-latest
    needs: [image-changes]
    if: needs.image-changes.outputs.frontend == 'true'
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build frontend image (not pushed)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    false
          load:    true
          tags:    agentic-cfo-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      - name: Smoke test - the built image holds the standalone server
        run: |
          docker run --rm --network none --entrypoint node agentic-cfo-frontend:ci \
            -e 'require("fs").accessSync("server.js"); require("fs").accessSync(".next/static"); console.log("server.js and .next/static present")'

  # ── Security scan: BLOCKING ────────────────────────────────────────────────
  # A fixable HIGH or CRITICAL finding fails this job: both scans use exit-code 1.
  # Trivy reads requirements.txt (the direct pins) when pointed at ./backend and
  # ignores constraints.txt, so the full pinned set (constraints.txt, direct and
  # transitive) is copied to a scratch requirements.txt and scanned too; the totals
  # are written to the job summary (last step).
  # History: report-only until 2026-11-26, when the langchain family was upgraded
  # (docs/ops/dependency-pinning.md) and both scans reached 0. Findings with no fixed
  # release are NOT skipped wholesale (no `ignore-unfixed`): the accepted ones are named, with a reason
  # and an expiry date, in .trivyignore.yaml (TRIVY_IGNOREFILE), so a new unfixed advisory in any other
  # package fails the job. Each entry's reachability is in docs/ops/dependency-pinning.md. Do not turn the
  # exit code back to 0.
  security:
    name: Security Scan (BLOCKING, fixable HIGH or CRITICAL findings fail)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the full pinned set for scanning
        run: |
          mkdir -p .trivy-scan
          cp backend/constraints.txt .trivy-scan/requirements.txt

      - name: Trivy - direct pins in backend/ (BLOCKING)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type:   fs
          scan-ref:    ./backend
          scanners:    vuln
          format:      table
          exit-code:   1    # BLOCKING - see the comment above the job
          severity:    CRITICAL,HIGH
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

      - name: Trivy - full pinned set incl. transitive (BLOCKING)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type:   fs
          scan-ref:    ./.trivy-scan
          scanners:    vuln
          format:      table
          exit-code:   1    # BLOCKING - see the comment above the job
          severity:    CRITICAL,HIGH
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml

      # Totals in the run's summary page, so the count is visible without opening the log.
      # This step only reports; the two scans above are the gate.
      - name: Trivy totals in the job summary
        if: always()
        run: |
          {
            echo "### Trivy: HIGH/CRITICAL findings not named in .trivyignore.yaml (the scans above fail the job on any)"
            echo
            echo "| Scan | CRITICAL | HIGH | Total |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for scan in "direct pins (backend/)|./backend" "full pinned set (constraints.txt)|./.trivy-scan"; do
            label="${scan%%|*}"; ref="${scan##*|}"
            if trivy fs --scanners vuln --severity CRITICAL,HIGH --ignorefile .trivyignore.yaml --format json --output /tmp/trivy.json "$ref" >/dev/null 2>&1; then
              python3 - "$label" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          c = {"CRITICAL": 0, "HIGH": 0}
          for r in json.load(open("/tmp/trivy.json")).get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  c[v["Severity"]] = c.get(v["Severity"], 0) + 1
          print(f"| {sys.argv[1]} | {c['CRITICAL']} | {c['HIGH']} | {c['CRITICAL'] + c['HIGH']} |")
          PY
            else
              echo "| $label | n/a | n/a | scan did not run |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Check for .env files accidentally committed
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$'; then
            echo "❌ .env file found in git — please add to .gitignore"
            exit 1
          fi
          echo "✓ No .env files committed"
