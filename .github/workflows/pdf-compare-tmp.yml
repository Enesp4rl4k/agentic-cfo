name: PDF extraction old vs new (temporary)

# Temporary job of the pdfminer/pdfplumber upgrade PR: runs the same synthetic corpus through the old and the
# new parser versions and fails when the extracted text, tables, word boxes or pipeline results differ.
# Removed before merge; the script stays (backend/scripts/pdf_extraction_snapshot.py).
on:
  pull_request:
    paths:
      - ".github/workflows/pdf-compare-tmp.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Environments (old and new parser versions; everything else from the lock)
        working-directory: backend
        run: |
          grep -E '^(pymupdf|reportlab|pytesseract|pydantic|pydantic-settings|python-dotenv|pypdfium2|charset-normalizer|cryptography)==' constraints.txt > /tmp/common.txt
          python -m venv /tmp/old && python -m venv /tmp/new
          /tmp/old/bin/pip install -q -c /tmp/common.txt pdfplumber==0.11.3 pdfminer.six==20231228 Pillow==12.3.0 pymupdf reportlab pytesseract pydantic-settings
          /tmp/new/bin/pip install -q -c /tmp/common.txt pdfplumber==0.11.9 pdfminer.six==20251230 Pillow==13.0.0 pymupdf reportlab pytesseract pydantic-settings
          /tmp/old/bin/pip list 2>/dev/null | grep -iE "pdfplumber|pdfminer|pillow|pymupdf"
          /tmp/new/bin/pip list 2>/dev/null | grep -iE "pdfplumber|pdfminer|pillow|pymupdf"
      - name: Generate corpus once, extract with both
        working-directory: backend
        run: |
          /tmp/new/bin/python scripts/pdf_extraction_snapshot.py gen /tmp/corpus
          ls -la /tmp/corpus
          /tmp/old/bin/python scripts/pdf_extraction_snapshot.py extract /tmp/corpus /tmp/old.json
          /tmp/new/bin/python scripts/pdf_extraction_snapshot.py extract /tmp/corpus /tmp/new.json
          python - <<'PY'
          import json
          for n in ("old", "new"):
              d = json.load(open(f"/tmp/{n}.json"))["files"]
              print(n, {k: (len(v["pdfplumber_pages"]), v["pipeline"]["strategy"], round(v["pipeline"]["confidence"], 3), len(v["pipeline"]["text"])) for k, v in d.items()})
          PY
      - name: Diff
        run: |
          if diff -u /tmp/old.json /tmp/new.json > /tmp/diff.txt; then echo "IDENTICAL: no difference in text, tables, word boxes or pipeline output"; else echo "DIFFERENCES:"; head -c 20000 /tmp/diff.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-extraction-snapshots
          path: |
            /tmp/old.json
            /tmp/new.json
            /tmp/diff.txt
